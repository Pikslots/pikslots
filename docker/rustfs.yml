services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    command: --access-key rustfsadmin --secret-key rustfsadmin /data

volumes:
  rustfs_data:
