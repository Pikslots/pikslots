name: E2E

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: Backend E2E (real infra)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real, hardcoded env vars for every step in this job (not a written
    # .test.env file). @nestjs/config's ConfigModule.forRoot() always merges
    # `process.env` over whatever it loaded from a file
    # (config = {...fileConfig, ...process.env}), so real env vars here are
    # picked up regardless of envFilePath resolution, cwd, or which
    # ConfigModule.forRoot() call happens to run first — a file written to
    # disk in an earlier step doesn't have that guarantee. Not real secrets;
    # throwaway values for an ephemeral, isolated test run.
    env:
      NODE_ENV: test
      PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pikslots_test

      JWT_SECRET: e2e-ci-jwt-secret
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: e2e-ci-jwt-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 1d

      INVITE_JWT_SECRET: e2e-ci-invite-jwt-secret
      INVITE_JWT_EXPIRES_IN: 5m

      CORS_ORIGINS: http://localhost:5173
      BACKEND_PUBLIC_URL: http://localhost:3000
      FRONTEND_PUBLIC_URL: http://localhost:5173

      ENABLE_API_DOCS: 'false'

      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''

      MAIL_HOST: localhost
      MAIL_PORT: '1025'
      MAIL_USER: ci@pikslots.com
      MAIL_PASS: unused-in-ci
      MAIL_FROM: '"No Reply" <noreply@example.com>'

      S3_ENABLED: 'true'
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin
      S3_HOST: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET_NAME: pikslots-test
      S3_FORCED_PATH_STYLE: 'true'

    # Real Postgres, Redis, and S3 (RustFS) for packages/api/test — this
    # suite hits real infra end-to-end (Kysely, BullMQ worker, S3), it
    # never mocks these. Only email sending is mocked (see
    # test/common/real-infra-test-app.ts), so no mail server is needed here.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Matches DATABASE_URL in the job-level env block above.
          POSTGRES_DB: pikslots_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.0.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        # No --requirepass: GitHub Actions service containers can't override
        # a service's command, and the official redis image has no env var
        # for a password. REDIS_PASSWORD is left empty in the env block above;
        # BullMQ/ioredis skip AUTH entirely when the password is empty, so
        # this connects fine against an unauthenticated Redis.

      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: admin
          RUSTFS_SECRET_KEY: admin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -s -o /dev/null http://localhost:9000/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        # @pikslots/domain and @pikslots/shared resolve to their built dist/
        # output, not source, so the api package can't consume them until
        # this runs. Scoped to just these two (not `bun run build`/api's own
        # build) since api's own `nest build` fails on a pre-existing,
        # unrelated type error and isn't needed anyway — jest reads api's
        # TS source directly.
        run: bunx nx run-many -t build -p @pikslots/domain,@pikslots/shared

      - name: E2E tests (Business module, real infra)
        run: bun run test-e2e

      - name: Upload API e2e test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-test-report
          path: packages/api/test-report/e2e/
          retention-days: 14
